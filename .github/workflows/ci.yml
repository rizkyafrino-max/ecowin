name: CI

# Menjalankan tes otomatis pada setiap push dan pull request, supaya kerusakan terdeteksi sebelum digabung.
# Versi runner dikunci (bukan ubuntu-latest) agar CI tidak berubah sendiri saat GitHub memindahkan label ke Ubuntu baru;
# versi action memakai Node 24 (Node 20 sudah usang di GitHub Actions).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, bcmath, zip, exif, curl, openssl
          coverage: none
      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Tes (SQLite di memori, lihat phpunit.xml)
        run: php artisan test

  web:
    name: Web nasabah (React)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    name: Android (Kotlin)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Tes unit + build debug
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

# API + panel Laravel. Pasang di /etc/nginx/sites-available/ecowin-api
# Ganti API.DOMAIN-ANDA.ID dengan domain sebenarnya (skrip 03-nginx.sh melakukannya otomatis).
# HTTPS ditambahkan oleh certbot (langkah terpisah), jadi blok ini hanya mendengarkan port 80 dahulu.
server {
    listen 80;
    listen [::]:80;
    server_name API.DOMAIN-ANDA.ID;

    root /var/www/ecowin/backend/public;
    index index.php;

    # Unggahan foto (profil, laporan bug) diolah aplikasi; batas aplikasi lebih ketat.
    client_max_body_size 10m;

    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Berkas tersembunyi (.env, .git) tidak boleh pernah terlayani, kecuali /.well-known untuk HTTPS.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

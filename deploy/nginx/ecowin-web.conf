# Web nasabah (React, hasil build web/dist). Pasang di /etc/nginx/sites-available/ecowin-web
# Ganti WEB.DOMAIN-ANDA.ID dengan domain sebenarnya (skrip 03-nginx.sh melakukannya otomatis).
# HTTPS ditambahkan oleh certbot (langkah terpisah).
server {
    listen 80;
    listen [::]:80;
    server_name WEB.DOMAIN-ANDA.ID;

    root /var/www/ecowin/web/dist;
    index index.html;

    server_tokens off;

    # Header keamanan (lihat DEPLOY.md bagian 3). CSP lain sudah disisipkan saat build.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "microphone=(), geolocation=(self)" always;

    # Berkas hasil build bernama hash: aman disimpan lama di peramban.
    # (add_header di dalam location menimpa yang di atas, maka header keamanan diulang.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # SPA: rute yang tidak dikenal diarahkan ke index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "microphone=(), geolocation=(self)" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx768m -Dfile.encoding=UTF-8
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m

# --- EcoWin ---
# Emulator: http://10.0.2.2:8000/api/  |  HP fisik (satu Wi-Fi): http://IP-LAPTOP:8000/api/
# Jalankan Laravel dengan: php artisan serve --host=0.0.0.0 --port=8000
ECOWIN_API_BASE_URL=http://10.0.2.2:8000/api/
# Isi dengan GOOGLE_CLIENT_ID (OAuth client "Web application") yang sama dengan .env Laravel.
# Selain itu buat OAuth client "Android" di Google Cloud (package id.ecowin.app + SHA-1 keystore debug/release).
ECOWIN_GOOGLE_WEB_CLIENT_ID=
